<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | ERA Shop</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body class="contact-page">
    <header>
        <nav class="navbar">
            <h2>ERA Shop</h2>
            <div class="links">
                <a href="index.html">Home</a>
                <a href="help.html">Help</a>
                <a href="contact.html">Contact</a>
                <a href="login.html">Login</a>
            </div>
        </nav>
    </header>

    <main class="auth-section">
        <div class="contact-intro">
            <p class="gohst">Join ERA Shop</p>
            <h1>Create account</h1>
            <p class="prag">Create your account to explore our latest fashion products and complete your purchases.</p>
        </div>

        <form class="auth-form" action="login.html">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name" required />
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required />
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm password</label>
                <input type="password" id="confirm-password" placeholder="Enter your confirm password" required />
            </div>

            <button type="submit">Create account</button>
            <p class="auth-link">Already have an account? <a href="login.html">Login here</a></p>
        </form>
    </main>

    <footer class="footer">
        <p>&copy; 2024 ERA Shop. All rights reserved.</p>
    </footer>
</body>

</html>
