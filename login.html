<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login | ERA Shop</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="contact-page">
        <header>
            <nav class="navbar">
                <h2>ERA Shop</h2>
                <div class="links">
                    <a href="index.html">Home</a>
                    <a href="help.html">Help</a>
                    <a href="contact.html">Contact</a>
                    <a href="login.html">Login</a>
                </div>
            </nav>
        </header>

        <main class="auth-section">
            <div class="contact-intro">
                <p class="gohst">Welcome back</p>
                <h1>Login</h1>
                <p class="prag">Sign in to continue shopping and keep track of your ERA Shop orders.</p>
            </div>

            <form class="auth-form" action="index.html">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit">Login</button>
                <p class="auth-link">Don't have an account? <a href="create.html">Create here</a></p>
            </form>
        </main>

        <footer class="footer">
            <p>&copy; 2024 ERA Shop. All rights reserved.</p>
        </footer>
    </body>
</html>
