<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact Us | ERA Shop</title>
	<link rel="stylesheet" href="style.css">
</head>
<body class="contact-page">
	<header>
		<nav class="navbar">
			<h2>ERA Shop</h2>
			<div class="links">
				<a href="index.html">Home</a>
				<a href="help.html">Help</a>
				<a href="contact.html" >Contact</a>
			</div>
		</nav>
	</header>
	<main class="contact-section">
		<div class="contact-intro">
			<p class="gohst">Get in touch</p>
			<h1>Contact us</h1>
			<p class="prag">Have a question about an order or one of our products? Send us a message and our team will get back to you.</p>
		</div>
		<form class="contact-form">
			<div class="form-row">
				<div class="form-group">
					<label for="name">Name</label>
					<input type="text" id="name" name="name" autocomplete="name" required>
				</div>

				<div class="form-group">
					<label for="email">Email</label>
					<input type="email" id="email" name="email" autocomplete="email" required>
				</div>
			</div>

			<div class="form-group">
				<label for="phone">Phone</label>
				<input type="tel" id="phone" name="phone" autocomplete="tel" required>
			</div>

			<div class="form-group">
				<label for="message">Message</label>
				<textarea id="message" name="message" rows="6" required></textarea>
			</div>

			<button type="submit" onclick="window.location.href='index.html'">Submit</button>
		</form>
	</main>

	<footer class="footer">
		<p>&copy; 2024 ERA Shop. All rights reserved.</p>
	</footer>
</body>
</html>
